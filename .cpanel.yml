---
# cPanel Git Deployment Configuration
deployment:
  branch: main
  restartable: yes
  
hooks:
  # Pre-deployment: Install dependencies
  - 
    event: pre_deploy
    action: |
      npm install
      npm run build
  
  # Post-deployment: Copy files
  - 
    event: post_deploy
    action: |
      cp -r dist/* $DEPLOY_TARGET/
